<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.8 0"/>
    </filter>
  </defs>
  <rect width="320" height="320" filter="url(#grain)"/>
</svg>